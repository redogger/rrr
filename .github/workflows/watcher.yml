name: DULMS Watcher

on:
  # تشغيل تلقائي كل 5 دقايق
  schedule:
    - cron: '*/5 * * * *'
  
  # تشغيل يدوي
  workflow_dispatch:

# لمنع التشغيل المتوازي
concurrency:
  group: dulms-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🔍 Run watcher
        env:
          DULMS_USERNAME: ${{ secrets.DULMS_USERNAME }}
          DULMS_PASSWORD: ${{ secrets.DULMS_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DURATION_MIN: '5'
          CHECK_INTERVAL: '30'
        run: node watch.js

      - name: 💾 Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dulms-state.json
          key: dulms-state-${{ github.run_id }}
