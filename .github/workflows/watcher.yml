name: DULMS Watcher 24-7 (v10.2)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      duration_min:
        description: 'Run duration in minutes'
        required: false
        default: '50'

concurrency:
  group: dulms-watcher-relay
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            .dulms-state.json
            .dulms-session.json
            .dulms-session-meta.json
            .dulms-audit.log
          key: dulms-state-v102-${{ github.run_id }}
          restore-keys: |
            dulms-state-v102-
            dulms-state-v100-
            dulms-state-v95-
            dulms-session-

      - name: Restore state (artifact fallback)
        if: hashFiles('.dulms-state.json') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dulms-state-v102
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run watcher
        env:
          DULMS_USERNAME: ${{ secrets.DULMS_USERNAME }}
          DULMS_PASSWORD: ${{ secrets.DULMS_PASSWORD }}
          TG_TOKEN:       ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
          DURATION_MIN:   ${{ github.event.inputs.duration_min || '50' }}
          NODE_OPTIONS:   '--max-old-space-size=1024'
        run: node watch.js

      - name: Save state (cache)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .dulms-state.json
            .dulms-session.json
            .dulms-session-meta.json
            .dulms-audit.log
          key: dulms-state-v102-${{ github.run_id }}

      - name: Save state (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dulms-state-v102
          path: |
            .dulms-state.json
            .dulms-session.json
            .dulms-session-meta.json
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - name: Relay next run
        if: always()
        continue-on-error: true
        run: |
          sleep 5
          gh workflow run watcher.yml --ref "${GITHUB_REF_NAME}" \
            || gh workflow run watcher.yml --ref main \
            || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
