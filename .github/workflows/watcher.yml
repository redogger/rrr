name: DULMS Watcher

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: dulms-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore state and session
        uses: actions/cache/restore@v4
        with:
          path: |
            .dulms-state.json
            .dulms-session.json
            .dulms-session-meta.json
          key: dulms-v4
          restore-keys: |
            dulms-v4
            dulms-v33
            dulms-state-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run watcher
        env:
          DULMS_USERNAME: ${{ secrets.DULMS_USERNAME }}
          DULMS_PASSWORD: ${{ secrets.DULMS_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DURATION_MIN: '4.5'
        run: node watch.js

      - name: Save state and session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .dulms-state.json
            .dulms-session.json
            .dulms-session-meta.json
          key: dulms-v4

      - name: Upload state as artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dulms-state-backup
          path: .dulms-state.json
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            .dulms-state.json
            .dulms-session-meta.json
          retention-days: 3
          if-no-files-found: ignore
